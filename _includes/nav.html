<a class="skip-link" href="#main-content">跳到正文</a>
<nav class="site-nav" aria-label="主导航">
    <div class="nav-inner">
        <a class="brand" href="{{ site.baseurl }}/"><span class="brand-symbol" aria-hidden="true">f<span>.</span></span><span>feizaipp<span class="brand-note"> / 技术笔记</span></span></a>
        <button class="menu-toggle" type="button" aria-controls="site-menu" aria-expanded="false">菜单 <span aria-hidden="true">☰</span></button>
        <div class="site-menu" id="site-menu">
            <a href="{{ site.baseurl }}/" {% if page.url == '/' or paginator %}aria-current="page"{% endif %}>文章</a>
            <a href="{{ site.baseurl }}/tags/" {% if page.url == '/tags/' %}aria-current="page"{% endif %}>主题索引</a>
            <a href="{{ site.baseurl }}/about/" {% if page.url == '/about/' %}aria-current="page"{% endif %}>关于</a>
            {% if site.github_username %}<a class="nav-github" href="https://github.com/{{ site.github_username }}">GitHub <span aria-hidden="true">↗</span></a>{% endif %}
        </div>
    </div>
</nav>
<script>
(function () {
    var button = document.querySelector('.menu-toggle');
    var menu = document.querySelector('.site-menu');
    function close() { button.setAttribute('aria-expanded', 'false'); menu.classList.remove('is-open'); }
    button.addEventListener('click', function () {
        var open = button.getAttribute('aria-expanded') !== 'true';
        button.setAttribute('aria-expanded', String(open)); menu.classList.toggle('is-open', open);
    });
    document.addEventListener('keydown', function (event) { if (event.key === 'Escape' && button.getAttribute('aria-expanded') === 'true') { close(); button.focus(); } });
    document.addEventListener('click', function (event) { if (!event.target.closest('.site-nav') || event.target.closest('.site-menu a')) close(); });
})();
</script>
